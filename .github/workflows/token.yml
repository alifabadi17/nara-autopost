name: Perpanjang token Threads

on:
  schedule:
    - cron: "17 3 * * 1"   # tiap Senin 11:17 WITA
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Perpanjang atau tukar token
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: python3 -m nara refresh-token "$RUNNER_TEMP/new_token.txt"

      - name: Simpan token baru ke Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GH_PAT belum diisi, token baru tidak bisa disimpan."
            exit 1
          fi
          gh secret set THREADS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/new_token.txt"
          rm -f "$RUNNER_TEMP/new_token.txt"
          echo "THREADS_TOKEN di Secrets sudah diganti."
