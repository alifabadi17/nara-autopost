name: Ambil insight Threads

on:
  schedule:
    - cron: "45 15 * * *"   # tiap hari 23:45 WITA
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nara-post
  cancel-in-progress: false

jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Ambil views, likes, balasan
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python3 -m nara insights

      - name: Simpan
        run: |
          git config user.name "nara-bot"
          git config user.email "nara-bot@users.noreply.github.com"
          git add queue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perbarui insight"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
