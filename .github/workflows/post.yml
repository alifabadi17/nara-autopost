name: Posting Nara

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  issues:
    types: [edited]
  push:
    branches: [main]
    paths: ["queue/**", "images/**", "config.json"]

permissions:
  contents: write
  issues: write

concurrency:
  group: nara-post
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'antrean-nara')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cek format antrean
        run: python3 -m nara validate || true

      - name: Sinkron persetujuan dan posting
        id: post
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m nara post

      - name: Simpan status antrean
        if: always()
        run: |
          git config user.name "nara-bot"
          git config user.email "nara-bot@users.noreply.github.com"
          git add queue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Perbarui status antrean"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
