name: Posting Nara

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  issues:
    types: [edited]
  push:
    branches: [main]
    paths: ["queue/**", "images/**", "products/**", "config.json"]

permissions:
  contents: write
  issues: write

concurrency:
  group: nara-post
  cancel-in-progress: false

jobs:
  post:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'antrean-nara')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan git
        run: |
          git config user.name "nara-bot"
          git config user.email "nara-bot@users.noreply.github.com"
          git pull -q --rebase origin main || true

      - name: Buat gambar otomatis (Gemini) dan watermark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q pillow
          python3 -m nara generate
          python3 -m nara boards
          python3 -m nara watermark
          git add images queue
          if ! git diff --cached --quiet; then
            git commit -q -m "Watermark gambar"
            for i in 1 2 3; do
              git pull -q --rebase origin main && git push -q origin HEAD:main && break
              sleep 5
            done
          fi
          echo "IMAGE_REF=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cek format antrean
        run: python3 -m nara validate || true

      - name: Sinkron persetujuan dan posting
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m nara post

      - name: Simpan status antrean
        if: always()
        run: |
          git add queue
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Perbarui status antrean"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
