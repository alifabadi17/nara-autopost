name: Tes Gemini gambar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cek model dan coba buat 1 gambar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 -m nara gemini-test | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Simpan hasil tes
        run: |
          git config user.name "nara-bot"
          git config user.email "nara-bot@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Hasil tes Gemini"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
